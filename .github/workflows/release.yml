name: Build Noctis Android

on:
  push:
    tags:
      - "build-*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk Noctis-1.3.1.apk
          sha256sum Noctis-1.3.1.apk > Noctis-1.3.1.apk.sha256
          ls -lh Noctis-1.3.1.apk

      - name: Publish Android release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.1
          name: Noctis Android 1.3.1
          generate_release_notes: true
          files: |
            Noctis-1.3.1.apk
            Noctis-1.3.1.apk.sha256
